name: scan

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build:corpus
      - run: npm test
      - name: Optional SAST scans
        continue-on-error: true
        run: |
          npm run scan:eslint || true
          command -v semgrep >/dev/null && npm run scan:semgrep || true
          command -v njsscan >/dev/null && npm run scan:njsscan || true
      - name: Normalize and score if raw exists
        continue-on-error: true
        run: |
          npm run normalize || true
          npm run score || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results
          path: results/
          if-no-files-found: ignore
